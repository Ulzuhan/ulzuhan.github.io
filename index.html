<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ulzuhan</title>
  <meta name="description" content="Aplicaciones móviles por Manuel Linares.">
  <style>
    :root {
      --primary: #C0A062;
      --text: #2C2C2C;
      --muted: #6b6b6b;
      --bg: #FDFBF5;
      --border: #e6e0d2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px 40px;
      flex: 1;
      width: 100%;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 28px;
    }
    .subtitle {
      color: var(--muted);
      margin-bottom: 48px;
    }
    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--primary);
      margin: 32px 0 12px;
    }
    .app-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .app-card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .app-card-desc {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }
    .app-icon {
      display: inline-block;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #a8884d);
      color: white;
      text-align: center;
      line-height: 40px;
      font-size: 22px;
      margin-right: 12px;
      vertical-align: middle;
    }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ulzuhan</h1>
    <div class="subtitle">Aplicaciones por Manuel Linares</div>

    <h2>Apps</h2>
    <a class="app-card" href="./beacon-of-faith/">
      <div>
        <span class="app-icon">✝</span>
        <span class="app-card-title">Faro de Fe · Beacon of Faith</span>
      </div>
      <p class="app-card-desc" style="margin-top: 12px;">App católica de inspiración diaria — citas, santo del día, rosario, novenas y más.</p>
    </a>
  </div>

  <footer>
    <a href="mailto:ulzuhan.market@gmail.com">ulzuhan.market@gmail.com</a>
  </footer>
</body>
</html>
